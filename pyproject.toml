[project]
name = "dopplertrack"
version = "0.3.0"
description = "Acoustic geolocation from inaudible aircraft Doppler curves matched against ADS-B flight tracks"
readme = "README.md"
authors = [
    { name = "MacCallister Higgins", email = "maccallister.higgins@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["doppler", "ads-b", "geolocation", "acoustics", "osint", "spectrogram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
]

[project.urls]
Homepage = "https://github.com/mjshiggins/dopplertrack"
Issues = "https://github.com/mjshiggins/dopplertrack/issues"

[project.scripts]
dopplertrack = "dopplertrack.cli:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
